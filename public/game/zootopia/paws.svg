<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- A trail of faint paw prints, tiled behind the city. -->
  <defs>
    <g id="p">
      <ellipse cx="0" cy="6" rx="7" ry="6"/>
      <ellipse cx="-8" cy="-2" rx="3" ry="3.8"/>
      <ellipse cx="-3" cy="-7" rx="3" ry="4"/>
      <ellipse cx="3" cy="-7" rx="3" ry="4"/>
      <ellipse cx="8" cy="-2" rx="3" ry="3.8"/>
    </g>
  </defs>
  <g fill="#ffffff" fill-opacity="0.06">
    <use href="#p" transform="translate(30 40) rotate(20)"/>
    <use href="#p" transform="translate(62 70) rotate(30)"/>
    <use href="#p" transform="translate(100 60) rotate(15)"/>
    <use href="#p" transform="translate(140 150) rotate(-25)"/>
    <use href="#p" transform="translate(170 120) rotate(-15)"/>
    <use href="#p" transform="translate(40 170) rotate(5)"/>
  </g>
</svg>
