<svg xmlns="http://www.w3.org/2000/svg" width="480" height="200" viewBox="0 0 480 200">
  <!-- A city at night with a tall tower lit at the top - every hero city has
       one. Searchlight beams cross the sky. Nobody's in particular. -->
  <g fill="#f4c430" fill-opacity="0.10">
    <path d="M150 200L60 0H110Z"/>
    <path d="M330 200L420 0H370Z"/>
  </g>
  <g fill="#1c1f3a">
    <rect x="0" y="120" width="44" height="80"/>
    <rect x="48" y="96" width="30" height="104"/>
    <rect x="82" y="136" width="26" height="64"/>
    <rect x="112" y="110" width="36" height="90"/>
    <rect x="300" y="104" width="38" height="96"/>
    <rect x="342" y="130" width="28" height="70"/>
    <rect x="374" y="90" width="34" height="110"/>
    <rect x="412" y="124" width="68" height="76"/>
  </g>
  <!-- the tower -->
  <g fill="#262a4d">
    <path d="M200 200V70L222 40L244 70V200Z"/>
    <rect x="186" y="150" width="72" height="50"/>
    <rect x="246" y="96" width="40" height="104"/>
    <rect x="156" y="120" width="36" height="80"/>
  </g>
  <path d="M212 56H232V64H212Z" fill="#f4c430"/>
  <circle cx="222" cy="48" r="4" fill="#ff5a4a"/>
  <!-- lit windows -->
  <g fill="#f4c430" fill-opacity="0.85">
    <rect x="8" y="130" width="4" height="5"/><rect x="24" y="146" width="4" height="5"/>
    <rect x="56" y="106" width="4" height="5"/><rect x="66" y="124" width="4" height="5"/>
    <rect x="120" y="120" width="4" height="5"/><rect x="134" y="140" width="4" height="5"/>
    <rect x="210" y="84" width="4" height="5"/><rect x="228" y="100" width="4" height="5"/>
    <rect x="214" y="122" width="4" height="5"/><rect x="254" y="110" width="4" height="5"/>
    <rect x="270" y="130" width="4" height="5"/><rect x="308" y="114" width="4" height="5"/>
    <rect x="322" y="136" width="4" height="5"/><rect x="384" y="102" width="4" height="5"/>
    <rect x="396" y="124" width="4" height="5"/><rect x="424" y="134" width="4" height="5"/>
    <rect x="452" y="150" width="4" height="5"/>
  </g>
</svg>
